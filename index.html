<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Groceries Chat</title>

<!-- Favicon & Mobile Icons -->
<link rel="icon" href="supermarket.png" type="image/png">
<link rel="apple-touch-icon" href="supermarket.png">
<link rel="icon" sizes="192x192" href="supermarket.png">

<!-- PWA Manifest -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a84ff">

<style>
:root {
  --bg-primary: #121212;
  --bg-secondary: #1e1e1e;
  --text-primary: #e0e0e0;
  --text-secondary: #aaaaaa;
  --bubble-user: #0a84ff;
  --bubble-item: #2c2c2e;
  --bubble-user-light: #0a84ff;
  --bubble-item-light: #e0e0e0;
  --bg-primary-light: #f9f9f9;
  --bg-secondary-light: #e5e5e5;
  --text-primary-light: #111111;
  --text-secondary-light: #555555;
}

body.light {
  --bg-primary: var(--bg-primary-light);
  --bg-secondary: var(--bg-secondary-light);
  --text-primary: var(--text-primary-light);
  --text-secondary: var(--text-secondary-light);
  --bubble-user: var(--bubble-user-light);
  --bubble-item: var(--bubble-item-light);
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
  background-color: var(--bg-primary);
  color: var(--text-primary);
  display: flex;
  flex-direction: column;
  height: 100vh;
  transition: all 0.4s ease;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

/* Screens */
.screen { display: none; flex-direction: column; height: 100%; }
.screen.active { display: flex; }

/* Header */
.chat-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 12px;
  background-color: var(--bg-secondary);
  border-bottom: 1px solid #333;
  font-size: 16px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.chat-header span { font-weight: 600; font-size: 16px; text-align: center; flex: 1; }

.chat-header button {
  background: none;
  border: none;
  color: var(--bubble-user);
  font-size: 22px;
  cursor: pointer;
}

/* Menu */
.menu-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 16px;
}

.menu-button {
  background-color: var(--bubble-user);
  border: none;
  border-radius: 12px;
  padding: 12px 20px;
  font-size: 16px;
  color: #fff;
  cursor: pointer;
}

/* Chat */
.chat-container {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  display: flex;
  flex-direction: column;
  scroll-behavior: smooth;
}

.bubble {
  max-width: 95%;
  padding: 12px 16px;
  border-radius: 18px;
  margin-bottom: 10px;
  font-size: 16px;
  line-height: 1.4;
  animation: fadeIn 0.3s ease;
  word-wrap: break-word;
  touch-action: pan-y;
  transition: transform 0.2s ease;
}

.bubble.item {
  background-color: var(--bubble-item);
  color: var(--text-primary);
  align-self: flex-start;
  border-bottom-left-radius: 4px;
  display: flex;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}

.item-name { font-weight: 500; max-width: 60%; overflow-wrap: break-word; font-size: 16px; }
.item-controls { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }

.item-quantity {
  font-size: 14px;
  color: var(--text-secondary);
  background-color: #3a3a3c;
  border-radius: 12px;
  padding: 2px 6px;
  display: flex;
  align-items: center;
  gap: 4px;
}

.item-quantity button {
  background: none;
  border: none;
  color: var(--text-primary);
  font-size: 16px;
  cursor: pointer;
  width: 28px;
  height: 28px;
  border-radius: 50%;
}

.item-delete { cursor: pointer; color: #ff3b30; font-weight: bold; font-size: 16px; margin-left: 6px; }

/* Input */
.input-container {
  padding: 8px 8px;
  border-top: 1px solid #333;
  background-color: var(--bg-secondary);
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}

.product-input {
  flex: 1 1 100%;
  min-width: 120px;
  border: none;
  border-radius: 22px;
  padding: 10px 14px;
  font-size: 16px;
  outline: none;
  background-color: #2c2c2e;
  color: var(--text-primary);
}

.product-input::placeholder { color: var(--text-secondary); }

.quantity-controls {
  display: flex;
  align-items: center;
  gap: 4px;
  background-color: #2c2c2e;
  border-radius: 20px;
  padding: 2px 6px;
}

.quantity-btn { width: 30px; height: 30px; font-size: 16px; }
.quantity-display { min-width: 22px; text-align: center; font-size: 16px; color: var(--text-primary); }

.send-btn { width: 40px; height: 40px; font-size: 18px; }

/* Settings */
.settings-container {
  flex: 1;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.settings-item { font-size: 16px; padding: 12px; }

/* Light mode overrides */
body.light .product-input { background-color: #ffffff; color: var(--text-primary); }
body.light .product-input::placeholder { color: var(--text-secondary); }
body.light .quantity-controls { background-color: #e5e5e5; }
body.light .quantity-btn { color: var(--text-primary); }
body.light .quantity-display { color: var(--text-primary); }
body.light .item-quantity { background-color: #e5e5e5; color: var(--text-primary); }
body.light .item-quantity button { color: var(--text-primary); }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

@media(max-width: 480px){
  .bubble { max-width: 95%; font-size: 15px; }
  .item-name { max-width: 55%; font-size: 15px; }
  .quantity-display { min-width: 20px; font-size: 15px; }
  .send-btn { width: 36px; height: 36px; font-size: 16px; }
  .chat-header span { font-size: 16px; }
}
</style>
</head>
<body>

<!-- Menu Screen -->
<div id="menuScreen" class="screen active">
  <div class="menu-container">
    <button class="menu-button" onclick="showScreen('chatScreen')">Groceries List</button>
    <button class="menu-button" onclick="showScreen('settingsScreen')">Settings</button>
  </div>
</div>

<!-- Chat Screen -->
<div id="chatScreen" class="screen">
  <div class="chat-header">
    <button onclick="showScreen('menuScreen')">🏠</button>
    <span>The Groceries Chat</span>
    <button id="shareBtn">📤</button>
  </div>

  <div class="chat-container" id="chatContainer">
    <div class="bubble item" id="emptyState">🛒 Your grocery list is empty</div>
  </div>

  <div class="input-container">
    <input type="text" id="productInput" class="product-input" placeholder="Type an item...">
    <div class="quantity-controls">
      <button class="quantity-btn" onclick="changeQuantity(-1)">−</button>
      <span id="quantityDisplay" class="quantity-display">1</span>
      <button class="quantity-btn" onclick="changeQuantity(1)">+</button>
    </div>
    <button id="sendBtn" class="send-btn" disabled>➤</button>
  </div>
</div>

<!-- Settings Screen -->
<div id="settingsScreen" class="screen">
  <button class="home-btn" onclick="showScreen('menuScreen')">🏠 Home</button>
  <div class="settings-container">
    <div class="settings-item">
      <span id="themeLabel">🌙 Turn on Light Mode</span>
      <span id="lightBulb">💡</span>
    </div>
  </div>
</div>

<script>
// JS: Grocery list, theme toggle, share, swipe-to-delete
let groceryItems = JSON.parse(localStorage.getItem('groceryItems')) || [];
let currentQuantity = 1;
const input = document.getElementById('productInput');
const sendBtn = document.getElementById('sendBtn');
const chat = document.getElementById('chatContainer');
const qtyDisplay = document.getElementById('quantityDisplay');
const themeLabel = document.getElementById('themeLabel');
const lightBulb = document.getElementById('lightBulb');
const shareBtn = document.getElementById('shareBtn');

let savedTheme = localStorage.getItem('theme');
if(!savedTheme) savedTheme = window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
document.body.classList.toggle('light', savedTheme==='light');
updateThemeLabel();

lightBulb.addEventListener('click',()=>{
  const isLight=!document.body.classList.contains('light');
  document.body.classList.toggle('light',isLight);
  localStorage.setItem('theme',isLight?'light':'dark');
  updateThemeLabel();
});

function updateThemeLabel(){
  const isLight=document.body.classList.contains('light');
  if(isLight){
    themeLabel.textContent='🌙 Turn on Dark Mode';
    lightBulb.style.color='#FFD700'; lightBulb.style.filter='drop-shadow(0 0 8px #FFD700)';
  }else{
    themeLabel.textContent='🌞 Turn on Light Mode';
    lightBulb.style.color='#555'; lightBulb.style.filter='none';
  }
}

function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }

input.addEventListener('input',()=>sendBtn.disabled=input.value.trim().length===0);
input.addEventListener('keypress',e=>{if(e.key==='Enter'&&input.value.trim()) addItem();});
sendBtn.addEventListener('click',addItem);

function changeQuantity(delta){ currentQuantity=Math.max(1,currentQuantity+delta); qtyDisplay.textContent=currentQuantity; }
function addItem(){ const name=input.value.trim(); if(!name) return; const existing=groceryItems.find(item=>item.name.toLowerCase()===name.toLowerCase()); if(existing) existing.quantity+=currentQuantity; else groceryItems.push({name,quantity:currentQuantity}); saveItems(); input.value=''; currentQuantity=1; qtyDisplay.textContent='1'; sendBtn.disabled=true; updateDisplay(); }

function updateDisplay(){
  chat.innerHTML='';
  if(!groceryItems.length){ chat.innerHTML='<div class="bubble item">🛒 Your grocery list is empty</div>'; return; }
  groceryItems.forEach((item,index)=>{
    const bubble=document.createElement('div'); bubble.className='bubble item';
    const nameSpan=document.createElement('span'); nameSpan.className='item-name'; nameSpan.textContent=item.name;
    const qtyControls=document.createElement('div'); qtyControls.className='item-controls';
    const qtySpan=document.createElement('span'); qtySpan.className='item-quantity';
    const minusBtn=document.createElement('button'); minusBtn.textContent='−'; minusBtn.onclick=()=>changeItemQuantity(index,-1); minusBtn.disabled=item.quantity===1;
    const qtyText=document.createElement('span'); qtyText.textContent=`x${item.quantity}`;
    const plusBtn=document.createElement('button'); plusBtn.textContent='+'; plusBtn.onclick=()=>changeItemQuantity(index,1);
    qtySpan.append(minusBtn,qtyText,plusBtn);
    const deleteBtn=document.createElement('span'); deleteBtn.className='item-delete'; deleteBtn.textContent='×'; deleteBtn.onclick=()=>deleteItem(index);
    qtyControls.append(qtySpan,deleteBtn);
    bubble.append(nameSpan,qtyControls);

    let startX=0, currentX=0;
    bubble.addEventListener('touchstart', e=>{ startX=e.touches[0].clientX; });
    bubble.addEventListener('touchmove', e=>{ currentX=e.touches[0].clientX; const diff = currentX-startX; if(diff<0) bubble.style.transform=`translateX(${diff}px)`; });
    bubble.addEventListener('touchend', e=>{ const diff=currentX-startX; if(diff<-100) deleteItem(index); bubble.style.transform='translateX(0)'; });

    chat.appendChild(bubble);
  });

  const clear=document.createElement('div'); clear.className='system-action'; clear.textContent='Clear List'; clear.onclick=clearList; chat.appendChild(clear);
  chat.scrollTop=chat.scrollHeight;
}

function changeItemQuantity(index,delta){ groceryItems[index].quantity=Math.max(1,groceryItems[index].quantity+delta); saveItems(); updateDisplay(); }
function deleteItem(index){ groceryItems.splice(index,1); saveItems(); updateDisplay(); }
function clearList(){ groceryItems=[]; saveItems(); updateDisplay(); }
function saveItems(){ localStorage.setItem('groceryItems',JSON.stringify(groceryItems)); }

shareBtn.addEventListener('click', ()=>{
  if(!groceryItems.length) { alert("Your list is empty!"); return; }
  const listText = groceryItems.map(i => `${i.name} x${i.quantity}`).join('\n');
  navigator.clipboard.writeText(listText).then(()=>{ alert("Grocery list copied!"); }).catch(()=>{ alert("Failed to copy list."); });
});

updateDisplay();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(()=>console.log('SW registered')).catch(err=>console.log('SW failed', err));
}
</script>
</body>
</html>
